name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "$CRATE" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $CRATE"
            exit 1
          fi
          echo "releasing $CRATE"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl
          rustup default stable

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="cicdbar-${VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "$DIR"
          cp target/x86_64-unknown-linux-musl/release/cicdbar "$DIR/"
          strip "$DIR/cicdbar"
          cp README.md LICENSE config.example.toml "$DIR/"
          cp -r docs "$DIR/docs"
          tar czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
          # Confirm the artefact really is static and really runs.
          # A musl build is "static-pie linked"; plain "not a dynamic
          # executable" from ldd only covers the non-PIE case.
          file "$DIR/cicdbar"
          if ! file "$DIR/cicdbar" | grep -qE "static-pie linked|statically linked"; then
            echo "binary is not static:"; file "$DIR/cicdbar"; exit 1
          fi
          if ldd "$DIR/cicdbar" 2>&1 | grep -qE "=> */"; then
            echo "binary has shared library dependencies:"; ldd "$DIR/cicdbar"; exit 1
          fi
          "$DIR/cicdbar" --version

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cicdbar-*.tar.gz
            cicdbar-*.tar.gz.sha256
          generate_release_notes: true
