name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build the wheel without releasing or publishing, so the
  # packaging path can be exercised outside a real release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "$CRATE" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $CRATE"
            exit 1
          fi
          echo "releasing $CRATE"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl
          rustup default stable

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="cicdbar-${VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "$DIR"
          cp target/x86_64-unknown-linux-musl/release/cicdbar "$DIR/"
          strip "$DIR/cicdbar"
          cp README.md LICENSE config.example.toml "$DIR/"
          cp -r docs "$DIR/docs"
          tar czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
          # Confirm the artefact really is static and really runs.
          # A musl build is "static-pie linked"; plain "not a dynamic
          # executable" from ldd only covers the non-PIE case.
          file "$DIR/cicdbar"
          if ! file "$DIR/cicdbar" | grep -qE "static-pie linked|statically linked"; then
            echo "binary is not static:"; file "$DIR/cicdbar"; exit 1
          fi
          if ldd "$DIR/cicdbar" 2>&1 | grep -qE "=> */"; then
            echo "binary has shared library dependencies:"; ldd "$DIR/cicdbar"; exit 1
          fi
          "$DIR/cicdbar" --version

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cicdbar-*.tar.gz
            cicdbar-*.tar.gz.sha256
          generate_release_notes: true

  # PyPI wheels, so `uvx cicdbar` works without a Rust toolchain.
  #
  # Linux only, deliberately: this is a waybar module talking to D-Bus, so a
  # macOS or Windows wheel would install a binary that cannot do anything.
  pypi-wheels:
    name: Wheel ${{ matrix.b2w_platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            b2w_platform: linux-x86_64
            binary: cicdbar

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package wheel
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          pip install vendor/bin-to-wheel
          bin-to-wheel \
            --name cicdbar \
            --version "$VERSION" \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --platform "${{ matrix.b2w_platform }}" \
            --description "waybar widget for GitHub Actions + Blacksmith CI/CD spend and live job status" \
            --author "Joachim Rosskopf" \
            --license "MIT" \
            --url "https://github.com/jrosskopf/cicdbar" \
            --readme README.md \
            --entry-point cicdbar \
            --output-dir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.b2w_platform }}
          path: dist/*.whl

  pypi-publish:
    name: Publish to PyPI
    # Never publish from a manual dry run -- only from a real tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pypi-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
