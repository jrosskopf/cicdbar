[package]
name = "cicdbar"
version = "2026.9.2"
edition = "2021"
rust-version = "1.85"
description = "waybar widget showing GitHub Actions and Blacksmith CI/CD spend, plus live job status"
authors = ["Joachim Rosskopf <jr@data-zoo.de>"]
license = "MIT"
repository = "https://github.com/jrosskopf/cicdbar"
homepage = "https://github.com/jrosskopf/cicdbar"
documentation = "https://github.com/jrosskopf/cicdbar#readme"
readme = "README.md"
keywords = ["waybar", "github-actions", "ci", "billing", "statusbar"]
categories = ["command-line-utilities"]
exclude = ["docs/*.png", "/.github"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
toml = "0.8"

[dev-dependencies]
tiny_http = "0.12"

[features]
live = []

[lib]
name = "cicdbar"
path = "src/lib.rs"

[[bin]]
name = "cicdbar"
path = "src/main.rs"
